name: Publier une actualité ou un billet Blog validé



on:

  issues:
  
    types: [labeled]
    


permissions:

  contents: write
  
  issues: read
  


jobs:

  publier:
  
    if: github.event.label.name == 'publication-validée' || github.event.label.name == 'blog-publication-validée'
    
    runs-on: ubuntu-latest
    
    steps:
    
      - name: Vérifier les droits de l’administrateur
      
        env:
        
          GH_TOKEN: ${{ github.token }}
          
          ACTOR: ${{ github.actor }}
          
          REPOSITORY: ${{ github.repository }}
          
        run: |
        
          permission=$(gh api "repos/${REPOSITORY}/collaborators/${ACTOR}/permission" --jq '.permission' 2>/dev/null || echo none)
          
          case "$permission" in
          
            admin|maintain|write) echo "Validation autorisée ($permission)" ;;
            
            *) echo "Le labeler ne possède pas les droits requis ($permission)."; exit 1 ;;
            
          esac
          


      - name: Récupérer le dépôt
      
        uses: actions/checkout@v4
        
        with:
        
          fetch-depth: 0
          


      - name: Générer automatiquement le contenu Markdown
      
        env:
        
          ISSUE_BODY: ${{ github.event.issue.body }}
          
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          
          ISSUE_TITLE: ${{ github.event.issue.title }}
          
          PUBLICATION_LABEL: ${{ github.event.label.name }}
          
        run: |
        
          python3 - <<'PY'
          
          import datetime, json, os, re, unicodedata
          
          from pathlib import Path
          


          body = os.environ.get('ISSUE_BODY', '')
          


          def field(label):
          
              pattern = rf"###\s+{re.escape(label)}\s*\n+(.+?)(?=\n###\s|\Z)"
              
              match = re.search(pattern, body, re.S | re.I)
              
              if not match:
              
                  return ''
                  
              return re.sub(r'<!--.*?-->', '', match.group(1), flags=re.S).strip()
              


          is_blog = os.environ.get('PUBLICATION_LABEL') == 'blog-publication-validée'
          
          if is_blog:
          
              title = field('Titre proposé') or os.environ.get('ISSUE_TITLE', 'Billet de blog')
              
              category = field('Type de billet') or 'Billet'
              
              draft = field('Votre brouillon')
              
          else:
          
              title = field('Titre de l’actualité') or field("Titre de l'actualité") or os.environ.get('ISSUE_TITLE', 'Actualité')
              
              category = field('Type d’actualité') or field("Type d'actualité") or 'Actualité'
              
              draft = field('Décrivez l’actualité')
              


          author_github = re.sub(r'[^A-Za-z0-9-]', '', field('Pseudo GitHub du rédacteur').lstrip('@')).strip()
          
          author_name = field('Nom et prénom à afficher (facultatif)').strip()
          
          if not author_github:
          
              raise SystemExit('Le pseudo GitHub du rédacteur est obligatoire.')
              


          photos = field('Photos à publier (facultatif)')
          
          sources = field('Sources et liens utiles (facultatif)')
          
          if photos:
          
              draft = (draft + '\n\n## Photos\n\n' + photos).strip()
              
          if sources:
          
              draft = (draft + '\n\n## Sources\n\n' + sources).strip()
              
          if not draft:
          
              raise SystemExit('La proposition ne contient pas de texte.')
              


          def slugify(value):
          
              value = unicodedata.normalize('NFKD', value).encode('ascii', 'ignore').decode().lower()
              
              return re.sub(r'[^a-z0-9]+', '-', value).strip('-')[:70] or ('billet' if is_blog else 'actualite')
              


          folder = Path('docs/blog' if is_blog else 'docs/actualites')
          
          folder.mkdir(parents=True, exist_ok=True)
          
          target = folder / f'{slugify(title)}.md'
          
          suffix = 2
          
          while target.exists():
          
              target = folder / f'{slugify(title)}-{suffix}.md'
              
              suffix += 1
              


          image, image_alt = '', ''
          
          first_image = re.search(r'!\[([^\]]*)\]\(([^)]+)\)', draft)
          
          if first_image:
          
              image_alt, image = first_image.group(1).strip(), first_image.group(2).strip()
              
          description = re.sub(r'[#>*_`\[\]!()]', ' ', draft)
          
          description = re.sub(r'\s+', ' ', description).strip()[:155]
          
          frontmatter = [
          
              '---', 'layout: wiki',
              
              f'title: {json.dumps(title, ensure_ascii=False)}',
              
              f'description: {json.dumps(description, ensure_ascii=False)}',
              
              f'date: {datetime.date.today().isoformat()}',
              
              f'category: {json.dumps(category, ensure_ascii=False)}',
              
              f'author_github: {json.dumps(author_github, ensure_ascii=False)}',
              
              f'author_name: {json.dumps(author_name, ensure_ascii=False)}',
              
              f'image: {json.dumps(image, ensure_ascii=False)}',
              
              f'image_alt: {json.dumps(image_alt, ensure_ascii=False)}',
              
              '---', '', f'# {title}', '', draft, '',
              
              f'---\n\n*Proposition validée depuis l’issue #{os.environ.get("ISSUE_NUMBER")}.*', ''
              
          ]
          
          target.write_text('\n'.join(frontmatter), encoding='utf-8')
          
          print(f'Publication générée : {target}')
          
          PY
          


      - name: Publier le contenu
      
        env:
        
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          
          PUBLICATION_LABEL: ${{ github.event.label.name }}
          
        run: |
        
          git config user.name "github-actions[bot]"
          
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add docs/actualites docs/blog
          
          if [ "$PUBLICATION_LABEL" = "blog-publication-validée" ]; then
          
            git commit -m "Publie le billet Blog valide #${ISSUE_NUMBER}"
            
          else
          
            git commit -m "Publie l actualite validee #${ISSUE_NUMBER}"
            
          fi
          
          git push
          











































































































